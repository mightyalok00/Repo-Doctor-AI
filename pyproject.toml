[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doctor-ai"
version = "1.0.0"
description = "An AI-powered autonomous engineer that diagnoses, scores, and repairs GitHub repositories."
authors = [{ name = "RepoDoctor Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "streamlit==1.41.1",
    "plotly==5.24.1",
    "rich==13.9.4",
    "pytest==8.3.4",
    "httpx==0.28.1",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "jinja2==3.1.5"
]

[project.scripts]
repo-doctor = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
